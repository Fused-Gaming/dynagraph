name: Auto Publish on Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Only run if package.json version changed (indicates changesets version bump)
    if: contains(github.event.head_commit.modified, 'package.json')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run typecheck
        run: npm run typecheck

      - name: Run benchmarks
        run: npm run benchmark

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.npm_package_version }}
          release_name: Release v${{ env.npm_package_version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  notify:
    name: Notify on publish
    runs-on: ubuntu-latest
    needs: publish
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Publish notification
        run: |
          echo "✅ Published @h4shed/dynagraph@${{ steps.version.outputs.VERSION }}"
          echo "📦 https://www.npmjs.com/package/@h4shed/dynagraph"
