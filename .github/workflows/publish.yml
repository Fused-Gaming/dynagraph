name: Release & Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  publish:
    name: Build, Test & Publish to npm
    runs-on: ubuntu-latest
    # Only run if package.json version changed (indicates changesets version bump)
    if: contains(github.event.head_commit.modified, 'package.json')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run typecheck
        run: npm run typecheck

      - name: Run benchmarks
        run: npm run benchmark

      - name: Extract version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/**/*

      - name: Publish notification
        run: |
          echo "✅ Published @h4shed/dynagraph@${{ steps.version.outputs.VERSION }}"
          echo "📦 https://www.npmjs.com/package/@h4shed/dynagraph"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"
